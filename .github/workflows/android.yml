name: Appli Android

# Fabrique tempo.apk à chaque changement de l'appli (dossier app/) et le publie
# sur https://github.com/R4c4st/zap/releases/download/app/tempo.apk
# La clé de signature n'est jamais en clair dans le dépôt : elle est chiffrée avec le secret TEMPO_KEY.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dépendances Capacitor
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Tempo embarqué (dernière version de la page)
        working-directory: app
        run: |
          rm -rf www && mkdir www
          cp ../index.html ../manifest.json ../icon-192.png ../icon-512.png www/
          npx cap sync android

      - name: Clé de signature (secret TEMPO_KEY)
        id: key
        env:
          TEMPO_KEY: ${{ secrets.TEMPO_KEY }}
        run: |
          if [ -z "$TEMPO_KEY" ]; then
            echo "nokey=1" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret TEMPO_KEY absent : compilation de contrôle seulement, rien n'est publié."
            exit 0
          fi
          cd app
          if [ ! -f tempo-release.jks.enc ]; then
            # première fois : GitHub crée la clé de l'appli et la range chiffrée avec le secret
            keytool -genkeypair -keystore tempo-release.jks -alias tempo -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$TEMPO_KEY" -keypass "$TEMPO_KEY" -dname "CN=Rc4st, O=Rc4st, C=FR"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in tempo-release.jks -out tempo-release.jks.enc -pass env:TEMPO_KEY
            git add tempo-release.jks.enc
            git -c user.name="tempo-ci" -c user.email="tempo-ci@users.noreply.github.com" commit -qm "Clé de signature de l'appli (chiffrée avec le secret TEMPO_KEY)"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in tempo-release.jks.enc -out tempo-release.jks -pass env:TEMPO_KEY
          fi

      - name: Compilation
        working-directory: app/android
        env:
          TEMPO_KEY: ${{ secrets.TEMPO_KEY }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if [ "${{ steps.key.outputs.nokey }}" = "1" ]; then TASK=assembleDebug; else TASK=assembleRelease; fi
          ./gradlew $TASK --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publication de tempo.apk
        if: steps.key.outputs.nokey != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk tempo.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "Tempo — appli Android" --notes "Ouvre ce lien sur ton téléphone, télécharge tempo.apk et installe-le. Chaque nouvelle version s'installe par-dessus l'ancienne, sans perdre tes données."
          gh release upload app tempo.apk --clobber

      - name: Journal de fabrication
        if: always()
        run: |
          mkdir -p /tmp/journal && cd /tmp/journal
          git init -q && git checkout -q -b build-log
          NOTE=""; [ "${{ steps.key.outputs.nokey }}" = "1" ] && NOTE=" · secret TEMPO_KEY absent : compilation de contrôle, rien publié"
          echo "${{ job.status }} · run ${GITHUB_RUN_NUMBER} · $(date -u +%FT%TZ) · ${GITHUB_SHA}${NOTE}" > status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            tail -n 400 "$GITHUB_WORKSPACE/build.log" > build-tail.txt
            grep -nE "error:|e: |FAILED|What went wrong|Exception|cannot find symbol|incompatible types|warning: \[" "$GITHUB_WORKSPACE/build.log" | head -150 > errors.txt || true
          else
            echo "la compilation n'a pas démarré (voir les étapes précédentes)" > build-tail.txt
          fi
          git add -A
          git -c user.name="tempo-ci" -c user.email="tempo-ci@users.noreply.github.com" commit -qm "fabrication ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-log
